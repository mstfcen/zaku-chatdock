name: Firefox self-hosted development release

on:
  push:
    tags:
      - "dev-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3

      - name: Validate source
        run: ./scripts/check.sh

      - name: Build browser targets
        run: ./scripts/build.sh

      - name: Build Mozilla source archive
        run: ./scripts/make-amo-source.sh

      - name: Resolve artifacts
        id: vars
        shell: bash
        run: |
          VERSION="$(
            python3 - <<'PY'
          import json
          with open("extension/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"

          FIREFOX_TREE="$PWD/dist/unpacked/firefox-dev"
          SOURCE="$PWD/dist/zaku-chatdock-v${VERSION}-source.zip"

          test -s "$FIREFOX_TREE/manifest.json"
          test -s "$SOURCE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "firefox_tree=$FIREFOX_TREE" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Install Mozilla web-ext
        run: npm install --global web-ext

      - name: Mozilla self-hosted lint
        run: |
          web-ext lint \
            --source-dir "${{ steps.vars.outputs.firefox_tree }}" \
            --self-hosted \
            --warnings-as-errors

      - name: Sign unlisted Firefox build
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER"
          test -n "$AMO_JWT_SECRET"

          rm -rf signed
          mkdir -p signed

          web-ext sign \
            --source-dir "${{ steps.vars.outputs.firefox_tree }}" \
            --artifacts-dir signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code "${{ steps.vars.outputs.source }}" \
            --approval-timeout 900000

          SIGNED="$(
            find signed \
              -maxdepth 1 \
              -type f \
              -name '*.xpi' \
              | head -1
          )"

          test -s "$SIGNED"

          cp \
            "$SIGNED" \
            zaku-chatdock-firefox.xpi

      - name: Generate development update metadata
        run: |
          ./scripts/make-update-manifests.sh \
            zaku-chatdock-firefox.xpi

          python3 -m json.tool updates.json >/dev/null
          python3 -m json.tool native-update.json >/dev/null

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1
          then
            gh release upload \
              "$GITHUB_REF_NAME" \
              zaku-chatdock-firefox.xpi \
              "${{ steps.vars.outputs.source }}" \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              zaku-chatdock-firefox.xpi \
              "${{ steps.vars.outputs.source }}" \
              --title "Zaku ChatDock $GITHUB_REF_NAME" \
              --prerelease \
              --generate-notes
          fi

      - name: Publish development metadata to main
        run: |
          cp updates.json /tmp/chatdock-updates.json
          cp native-update.json /tmp/chatdock-native-update.json

          # Generated metadata dirties the detached tag checkout.
          # Save it above, reset the disposable CI worktree, then switch
          # cleanly to current main before publishing.
          git reset --hard HEAD
          git fetch origin main
          git switch -C main origin/main

          cp /tmp/chatdock-updates.json updates.json
          cp /tmp/chatdock-native-update.json native-update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add updates.json native-update.json

          if git diff --cached --quiet
          then
            echo "Update metadata unchanged."
            exit 0
          fi

          git commit \
            -m "Publish development update metadata for ${GITHUB_REF_NAME} [skip ci]"

          git push origin main
