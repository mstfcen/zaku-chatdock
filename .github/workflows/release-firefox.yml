name: Firefox signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3

      - name: Validate source
        run: ./scripts/check.sh

      - name: Build extension
        run: ./scripts/build.sh

      - name: Build Mozilla reviewer source archive
        run: ./scripts/make-amo-source.sh

      - name: Resolve version and artifacts
        id: vars
        shell: bash
        run: |
          VERSION="$(
            python3 - <<'PY'
          import json
          with open("extension/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"

          XPI="$PWD/dist/Zaku-ChatDock-v${VERSION}.xpi"
          SOURCE="$PWD/dist/zaku-chatdock-v${VERSION}-source.zip"

          test -s "$XPI"
          test -s "$SOURCE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xpi=$XPI" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

          echo "VERSION=$VERSION"
          ls -lh "$XPI" "$SOURCE"

      - name: Install Mozilla web-ext
        run: npm install --global web-ext

      - name: Mozilla lint
        run: |
          web-ext lint \
            --source-dir extension

      - name: Submit source and sign with Mozilla
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER"
          test -n "$AMO_JWT_SECRET"

          rm -rf signed
          mkdir -p signed

          web-ext sign \
            --source-dir extension \
            --artifacts-dir signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code "${{ steps.vars.outputs.source }}" \
            --approval-timeout 900000

          SIGNED="$(
            find signed \
              -maxdepth 1 \
              -type f \
              -name '*.xpi' \
              | head -1
          )"

          test -n "$SIGNED"
          test -s "$SIGNED"

          cp \
            "$SIGNED" \
            zaku-chatdock-firefox.xpi

          echo "SIGNED:"
          ls -lh zaku-chatdock-firefox.xpi

      - name: Generate self-update manifests
        run: |
          ./scripts/make-update-manifests.sh \
            zaku-chatdock-firefox.xpi

          python3 -m json.tool \
            updates.json >/dev/null

          python3 -m json.tool \
            native-update.json >/dev/null

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view \
            "$GITHUB_REF_NAME" \
            >/dev/null 2>&1
          then
            gh release upload \
              "$GITHUB_REF_NAME" \
              zaku-chatdock-firefox.xpi \
              "${{ steps.vars.outputs.source }}" \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              zaku-chatdock-firefox.xpi \
              "${{ steps.vars.outputs.source }}" \
              --title "Zaku ChatDock $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Publish update metadata to main
        run: |
          cp updates.json \
            /tmp/chatdock-updates.json

          cp native-update.json \
            /tmp/chatdock-native-update.json

          git fetch origin main

          git switch -C \
            main \
            origin/main

          cp \
            /tmp/chatdock-updates.json \
            updates.json

          cp \
            /tmp/chatdock-native-update.json \
            native-update.json

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            updates.json \
            native-update.json

          if git diff --cached --quiet
          then
            echo "Update manifests unchanged."
            exit 0
          fi

          git commit \
            -m "Publish update metadata for ${GITHUB_REF_NAME} [skip ci]"

          git push origin main

      - name: Summary
        run: |
          echo "=========================================="
          echo " Mozilla submission/signing completed"
          echo " Version: ${{ steps.vars.outputs.version }}"
          echo " Release: $GITHUB_REF_NAME"
          echo "=========================================="
