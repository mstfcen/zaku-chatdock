name: Firefox AMO Listed stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag, for example v0.9.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag matches manifest
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"

          git rev-parse \
            "refs/tags/$TAG" \
            >/dev/null

          VERSION="$(
            python3 - <<'PY'
          import json
          with open("extension/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"

          EXPECTED="${TAG#v}"

          test "$VERSION" = "$EXPECTED"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3

      - name: Validate source
        run: ./scripts/check.sh

      - name: Build browser targets
        run: ./scripts/build.sh

      - name: Build Mozilla source archive
        run: ./scripts/make-amo-source.sh

      - name: Resolve stable artifacts
        id: vars
        shell: bash
        run: |
          VERSION="$(
            python3 - <<'PY'
          import json
          with open("extension/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"

          FIREFOX_TREE="$PWD/dist/unpacked/firefox-stable"
          SOURCE="$PWD/dist/zaku-chatdock-v${VERSION}-source.zip"

          test -s "$FIREFOX_TREE/manifest.json"
          test -s "$SOURCE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "firefox_tree=$FIREFOX_TREE" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Install Mozilla web-ext
        run: npm install --global web-ext

      - name: Mozilla Listed lint
        run: |
          web-ext lint \
            --source-dir "${{ steps.vars.outputs.firefox_tree }}" \
            --warnings-as-errors

      - name: Submit AMO Listed release
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER"
          test -n "$AMO_JWT_SECRET"

          web-ext sign \
            --source-dir "${{ steps.vars.outputs.firefox_tree }}" \
            --channel listed \
            --amo-metadata config/amo-metadata.json \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code "${{ steps.vars.outputs.source }}" \
            --approval-timeout 900000

      - name: Generate Companion stable metadata
        run: |
          ./scripts/make-native-update-manifest.sh \
            "${{ inputs.tag }}"

          cp \
            native-update.json \
            /tmp/chatdock-native-update.json

      - name: Publish Companion metadata to main
        run: |
          git fetch origin main
          git switch -C main origin/main

          cp \
            /tmp/chatdock-native-update.json \
            native-update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add native-update.json

          if git diff --cached --quiet
          then
            echo "Native metadata unchanged."
            exit 0
          fi

          git commit \
            -m "Publish Companion metadata for ${{ inputs.tag }} [skip ci]"

          git push origin main
